schema_version: 1

context:
  version: "9.3.1"
  base_url: https://github.com/bazelbuild/bazel/releases/download
  bz_arch: ${{ "linux-x86_64" if build_platform == "linux-64" else
               "linux-arm64" if build_platform == "linux-aarch64" else
               "darwin-x86_64" if build_platform == "osx-64" else
               "darwin-arm64" if build_platform == "osx-arm64" else
               "undefined" }}
  bz_hash: ${{ "444c309e4d3a3007ef39debdf483e4399912a7d0073f52dfb56352a15a727dd8" if build_platform == "linux-64" else
               "b9dfab19c2f67d78f14aae8c6f250d40040177263c64a8cdf5008cd8e3a7db73" if build_platform == "linux-aarch64" else
               "4fdea4f435654aac531a904f6a0513576e48df2d9bc03d85b7aaaeb913c3cedb" if build_platform == "osx-64" else
               "68ccda4efe08b9f25b4cf480dadf7ffec428deaac0fe4868936c6085a80089dd" if build_platform == "osx-arm64" else
               "undefined" }}

package:
  name: ijar
  version: ${{ version }}

source:
  - url: ${{ base_url }}/${{ version }}/bazel-${{ version }}-dist.zip
    sha256: 6169ed42d506f3466fac899cc0a1ffa05718dece512cde9c2cd5eebf4e9ff4c3

  - url: ${{ base_url }}/${{ version }}/bazel_nojdk-${{ version }}-${{ bz_arch }}
    sha256: ${{ bz_hash }}
    file_name: bazel

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - bazel-toolchain >=0.5.0
    - openjdk
    - sed

tests:
  - script:
      - test -f $PREFIX/bin/ijar
      - test -f $PREFIX/bin/zipper

about:
  homepage: https://github.com/bazelbuild/bazel/tree/master/third_party/ijar
  license: Apache-2.0
  license_file: third_party/ijar/LICENSE
  summary: A tool for generating interface .jars from normal .jars

extra:
  recipe-maintainers:
    - xhochy
    - conda-forge/bazel
