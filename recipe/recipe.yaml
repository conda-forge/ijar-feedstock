schema_version: 1

context:
  version: "9.3.3"
  base_url: https://github.com/bazelbuild/bazel/releases/download
  # these are relative to build_platform, not target_platform
  # cannot use the more accurate `build_platform is startingwith("linux")`
  # here due to https://github.com/prefix-dev/rattler-build/issues/2961
  bz_os: ${{ "linux" if linux else "darwin" }}
  bz_arch: ${{ "x86_64" if build_platform in ("linux-64", "osx-64") else "arm64" }}
  bz_hash: ${{ "9f38a7e60bb03a320d1403d5c344c7cf5f8ab89d3478cb3472a1f8f4a11e8c49" if build_platform == "linux-64" else
               "fef3e5657afa77e7c257dd486031802b96e8d0df7b135feaa14d649d27ce22c6" if build_platform == "linux-aarch64" else
               "ae392bcc92ff73da614d58bd36e0da0ac32fbeb830c4423184829c3f11de9cc6" if build_platform == "osx-64" else
               "a404774c826a5322de4fa621dd03d9d83abf61544238f0cc9149291a03a7464f" }}

package:
  name: ijar
  version: ${{ version }}

source:
  - url: ${{ base_url }}/${{ version }}/bazel-${{ version }}-dist.zip
    sha256: d78e9aa4edd22076affca23c04d376a031982d63f75cbee16d0233fe3e848149

  - url: ${{ base_url }}/${{ version }}/bazel_nojdk-${{ version }}-${{ bz_os }}-${{ bz_arch }}
    sha256: ${{ bz_hash }}
    file_name: bazel

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - bazel-toolchain >=0.5.0
    - openjdk <26
    - sed

tests:
  - script:
      - test -f $PREFIX/bin/ijar
      - test -f $PREFIX/bin/zipper

about:
  homepage: https://github.com/bazelbuild/bazel/tree/master/third_party/ijar
  license: Apache-2.0
  license_file: third_party/ijar/LICENSE
  summary: A tool for generating interface .jars from normal .jars

extra:
  recipe-maintainers:
    - xhochy
    - conda-forge/bazel
